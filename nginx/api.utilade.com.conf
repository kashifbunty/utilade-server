# api.utilade.com — the conversion service.
#
# Its own file, on purpose. The other sites' configs are never touched, so a
# mistake in here can only ever break Utilade — and either can be turned off
# without disturbing the other.
#
# Install:
#   cp api.utilade.com.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/api.utilade.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Run `nginx -t` before reloading, every time. A bad config takes every site on the box
# down with it, because they all share the one daemon.

server {
    listen 80;
    listen [::]:80;
    server_name api.utilade.com;

    # Cloudflare terminates TLS in front of this and talks to the origin over
    # port 80. That is why there is no certificate here and no redirect: a
    # redirect to https would loop, because Cloudflare already believes it is
    # on https.
    #
    # It also means this port must not be reachable except through Cloudflare.
    # Restrict it at the firewall to Cloudflare's ranges before any real file
    # passes through, or the rate limiting can be walked around by anyone who
    # finds the IP address.

    # A conversion is not a web page. These are minutes, not seconds.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Files arrive whole, not in fragments, and buffering a 100 MB upload to
    # disk before the service sees it doubles the write for no gain.
    proxy_request_buffering off;
    client_max_body_size 100m;

    # Says which service answered, in a log that carries other sites' traffic too.
    access_log /var/log/nginx/utilade-api.access.log;
    error_log  /var/log/nginx/utilade-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The visitor's address, as Cloudflare saw it — anything else logs
        # Cloudflare's own address for every request in the world.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
